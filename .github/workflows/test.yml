name: Test Atlas
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U atlas -d atlas_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw && ./mvnw --batch-mode verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/atlas_test
          TEST_DB_USER: atlas
          TEST_DB_PASSWORD: atlas_test
